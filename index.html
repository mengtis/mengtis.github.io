<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mengti Sun — Under Construction</title>
<meta name="description" content="Mengti Sun's personal website is currently under construction.">
<style>
  :root {
    --bg-start: #0f172a;
    --bg-end: #1e1b4b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #a78bfa;
    --accent-2: #38bdf8;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg-end), var(--bg-start) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 70% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.3), transparent),
      radial-gradient(2px 2px at 10% 70%, rgba(255,255,255,0.4), transparent);
    background-size: 400px 400px;
    animation: drift 60s linear infinite;
    opacity: 0.7;
  }

  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(-400px); }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2.5rem;
    max-width: 560px;
  }

  .icon {
    font-size: 3.5rem;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
    margin-bottom: 1rem;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  h1 {
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 700;
    margin: 0 0 0.75rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.7;
    margin: 0 0 2rem;
  }

  .progress {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 2rem;
  }

  .progress-bar {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    animation: loading 2.2s ease-in-out infinite;
  }

  @keyframes loading {
    0% { transform: translateX(-100%); width: 40%; }
    50% { width: 60%; }
    100% { transform: translateX(250%); width: 40%; }
  }

  .socials {
    display: flex;
    gap: 1.25rem;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .socials a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    transition: all 0.2s ease;
  }

  .socials a:hover {
    color: var(--text);
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(167, 139, 250, 0.35);
  }

  footer {
    color: rgba(148, 163, 184, 0.6);
    font-size: 0.8rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="container">
    <div class="icon">🚧</div>
    <h1>Under Construction</h1>
    <p class="subtitle">
      Mengti Sun's personal website is being carefully built.<br>
      Stay tuned — it'll be live soon.
    </p>
    <div class="progress"><div class="progress-bar"></div></div>
    <div class="socials">
      <a href="mailto:mengtisun99@gmail.com">Contact via Email</a>
    </div>
    <footer>&copy; <span id="year"></span> Mengti Sun</footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
